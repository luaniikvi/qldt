<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="40%" stop-color="#312E81"/>
      <stop offset="100%" stop-color="#4338CA"/>
    </linearGradient>
    <linearGradient id="overlayGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(2, 5, 32, 0.88)"/>
      <stop offset="50%" stop-color="rgba(2, 5, 32, 0.5)"/>
      <stop offset="100%" stop-color="rgba(2, 5, 32, 0.1)"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad3)"/>
  
  <!-- Collaborative Team Workspace Graphics Right -->
  <g transform="translate(780, 80)">
    <!-- Main Kanban / Project Board -->
    <rect x="20" y="20" width="360" height="230" rx="16" fill="#FFFFFF" opacity="0.95"/>
    <!-- Header -->
    <rect x="40" y="42" width="120" height="12" rx="4" fill="#1E293B"/>
    <circle cx="345" cy="48" r="8" fill="#10B981"/>
    
    <!-- Kanban Columns -->
    <g transform="translate(40, 75)">
      <!-- Col 1: Nghiên cứu -->
      <rect x="0" y="0" width="95" height="150" rx="8" fill="#F1F5F9"/>
      <rect x="8" y="10" width="55" height="8" rx="3" fill="#64748B"/>
      <rect x="8" y="28" width="79" height="38" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
      <rect x="14" y="38" width="50" height="6" rx="2" fill="#3B82F6"/>
      <rect x="8" y="74" width="79" height="38" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
      <rect x="14" y="84" width="40" height="6" rx="2" fill="#10B981"/>

      <!-- Col 2: Triển khai -->
      <rect x="110" y="0" width="95" height="150" rx="8" fill="#F1F5F9"/>
      <rect x="118" y="10" width="60" height="8" rx="3" fill="#64748B"/>
      <rect x="118" y="28" width="79" height="45" rx="6" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
      <rect x="124" y="38" width="65" height="6" rx="2" fill="#1E293B"/>
      <rect x="124" y="50" width="45" height="6" rx="2" fill="#94A3B8"/>

      <!-- Col 3: Hoàn thành -->
      <rect x="220" y="0" width="95" height="150" rx="8" fill="#F1F5F9"/>
      <rect x="228" y="10" width="50" height="8" rx="3" fill="#64748B"/>
      <rect x="228" y="28" width="79" height="38" rx="6" fill="#ECFDF5" stroke="#A7F3D0"/>
      <rect x="234" y="38" width="55" height="6" rx="2" fill="#059669"/>
    </g>

    <!-- Team Avatar Badges Floating -->
    <g transform="translate(-10, 160)">
      <circle cx="20" cy="20" r="22" fill="#3B82F6" stroke="#FFFFFF" stroke-width="3"/>
      <text x="14" y="26" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="14">SV1</text>
      
      <circle cx="52" cy="20" r="22" fill="#10B981" stroke="#FFFFFF" stroke-width="3"/>
      <text x="44" y="26" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="14">SV2</text>
      
      <circle cx="84" cy="20" r="22" fill="#F59E0B" stroke="#FFFFFF" stroke-width="3"/>
      <text x="76" y="26" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="14">SV3</text>
    </g>
  </g>

  <!-- Left Shading Gradient -->
  <rect width="700" height="400" fill="url(#overlayGrad3)"/>
</svg>
