<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Duyệt đăng ký đề tài</title>
    <style>
        body { font-family: Segoe UI, sans-serif; margin: 24px; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; vertical-align: top; }
        form { margin: 4px 0; }
        input[type=text] { padding: 4px; width: 190px; }
        .ok { color: #1b5e20; background: #e8f5e9; padding: 8px 12px; }
        .error { color: #b00020; background: #fdecea; padding: 8px 12px; }
        .hint { color: #666; font-size: 0.9rem; }
    </style>
</head>
<body>
<h1>Duyệt đăng ký đề tài</h1>
<p><a th:href="@{/home}">Về trang chủ</a></p>

<p class="ok" th:if="${message}" th:text="${message}"></p>
<p class="error" th:if="${error}" th:text="${error}"></p>

<table>
    <thead>
    <tr>
        <th>Đề tài</th>
        <th>Nhóm</th>
        <th>Nhóm trưởng</th>
        <th>Thành viên</th>
        <th>Duyệt</th>
        <th>Từ chối</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="r : ${registrations}">
        <td>
            <div th:text="${r.topic.name}">Tên đề tài</div>
            <div class="hint" th:text="${r.topic.department}">Bộ môn</div>
        </td>
        <td th:text="|Nhóm của ${r.team.leader.fullName}|">Nhóm của A</td>
        <td th:text="|${r.team.leader.fullName} (${r.team.leader.studentCode})|">A (SV001)</td>
        <td>
            <div th:each="member : ${r.team.members}"
                 th:text="|${member.fullName} (${member.studentCode})|"></div>
        </td>
        <td>
            <form th:action="@{/registrations/{id}/approve(id=${r.topic.id})}" method="post">
                <button type="submit">Duyệt</button>
            </form>
        </td>
        <td>
            <form th:action="@{/registrations/{id}/reject(id=${r.topic.id})}" method="post">
                <input type="text" name="reason" placeholder="Lý do từ chối" required/>
                <button type="submit">Từ chối</button>
            </form>
        </td>
    </tr>
    <tr th:if="${#lists.isEmpty(registrations)}">
        <td colspan="6">Không có đăng ký nào đang chờ duyệt.</td>
    </tr>
    </tbody>
</table>
</body>
</html>
