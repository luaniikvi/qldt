services:
  mysql:
    image: mysql:8.0
    container_name: qldt-mysql
    restart: unless-stopped
    ports:
      - "${QLDT_DB_PORT:-3308}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "QldtRoot@2026"
      MYSQL_DATABASE: "qldt"
      MYSQL_USER: "qldt_app"
      MYSQL_PASSWORD: "QldtApp@2026"
      TZ: "Asia/Ho_Chi_Minh"
    command:
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_unicode_ci"
      - "--default-time-zone=+07:00"
    volumes:
      - qldt_mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  qldt_mysql_data:
    name: qldt_mysql_data
