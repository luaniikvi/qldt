<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Đề tài của tôi</title>
    <style>
        body { font-family: Segoe UI, sans-serif; margin: 24px; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; vertical-align: top; }
        form { margin: 4px 0; }
        input[type=text] { padding: 4px; width: 170px; }
        .ok { color: #1b5e20; background: #e8f5e9; padding: 8px 12px; }
        .error { color: #b00020; background: #fdecea; padding: 8px 12px; }
        .hint { color: #666; font-size: 0.9rem; }
    </style>
</head>
<body>
<h1>Đề tài của tôi</h1>
<p><a th:href="@{/home}">Về trang chủ</a> | <a th:href="@{/topics/new}">Đăng đề tài mới</a></p>

<p class="ok" th:if="${message}" th:text="${message}"></p>
<p class="error" th:if="${error}" th:text="${error}"></p>

<table>
    <thead>
    <tr>
        <th>Tên đề tài</th>
        <th>Đợt</th>
        <th>Bộ môn</th>
        <th>Giảng viên hướng dẫn</th>
        <th>Trạng thái</th>
        <th>Đăng ký</th>
        <th>Thao tác</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="topic : ${topics}">
        <td>
            <div th:text="${topic.name}">Tên đề tài</div>
            <div class="hint" th:text="${topic.description}">Nội dung</div>
            <div class="error" th:if="${topic.rejectionReason != null}"
                 th:text="|Lý do từ chối: ${topic.rejectionReason}|"></div>
        </td>
        <td th:text="${topic.period.name}">Đợt 1</td>
        <td th:text="${topic.department}">Công nghệ phần mềm</td>
        <td>
            <div th:each="advisor : ${topic.advisors}"
                 th:text="|${advisor.fullName} (${advisor.lecturerCode})|"></div>
        </td>
        <td th:text="${topic.status.label}">Chờ duyệt</td>
        <td th:text="${topic.availability.label}">Chưa có nhóm đăng ký</td>
        <td>
            <th:block
                    th:if="${topic.primaryAdvisor.username == currentUser and (topic.status.name() == 'PENDING' or topic.status.name() == 'REJECTED')}">
                <a th:href="@{/topics/{id}/edit(id=${topic.id})}">Sửa</a>
                <form th:if="${#lists.size(topic.advisors) == 1 and (topic.invitation == null or topic.invitation.status.name() != 'PENDING')}"
                      th:action="@{/topics/{id}/invite(id=${topic.id})}" method="post">
                    <input type="text" name="lecturerCode" placeholder="Mã GV cùng bộ môn" required/>
                    <button type="submit">Mời GVHD</button>
                </form>
                <div th:each="advisor : ${topic.advisors}"
                     th:if="${advisor.username != topic.primaryAdvisor.username}">
                    <form th:action="@{/topics/{id}/advisor/remove(id=${topic.id})}" method="post">
                        <input type="hidden" name="lecturerCode" th:value="${advisor.lecturerCode}"/>
                        <button type="submit" th:text="|Xóa GVHD ${advisor.fullName}|"></button>
                    </form>
                </div>
            </th:block>

            <th:block th:if="${topic.invitation != null}">
                <div class="hint"
                     th:text="|Lời mời: ${topic.invitation.lecturer.fullName} - ${topic.invitation.status.label}|"></div>
                <div class="hint" th:if="${topic.invitation.responseReason != null}"
                     th:text="|Lý do: ${topic.invitation.responseReason}|"></div>
                <th:block
                        th:if="${topic.invitation.status.name() == 'PENDING' and topic.invitation.lecturer.username == currentUser}">
                    <form th:action="@{/topics/{id}/invitation(id=${topic.id})}" method="post">
                        <input type="hidden" name="accept" value="true"/>
                        <button type="submit">Đồng ý</button>
                    </form>
                    <form th:action="@{/topics/{id}/invitation(id=${topic.id})}" method="post">
                        <input type="hidden" name="accept" value="false"/>
                        <input type="text" name="reason" placeholder="Lý do từ chối" required/>
                        <button type="submit">Từ chối</button>
                    </form>
                </th:block>
                <form th:if="${topic.primaryAdvisor.username == currentUser and topic.invitation.status.name() == 'PENDING'}"
                      th:action="@{/topics/{id}/invitation/cancel(id=${topic.id})}" method="post">
                    <button type="submit">Hủy lời mời</button>
                </form>
            </th:block>
        </td>
    </tr>
    <tr th:if="${#lists.isEmpty(topics)}">
        <td colspan="7">Bạn chưa có đề tài nào.</td>
    </tr>
    </tbody>
</table>
</body>
</html>
