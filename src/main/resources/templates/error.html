<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Lỗi</title>
    <style>
        body { font-family: Segoe UI, sans-serif; margin: 24px; max-width: 640px; }
        .code { font-size: 3rem; font-weight: 700; color: #b00020; margin: 0; }
    </style>
</head>
<body>
<h1>Đã xảy ra lỗi</h1>
<p class="code" th:text="${status}">500</p>
<p th:text="${error}">Internal Server Error</p>
<p th:text="${message}">Không có thông tin chi tiết.</p>
<p>Đường dẫn: <span th:text="${path}">/</span></p>
<p><a th:href="@{/home}">Về trang chủ</a></p>
</body>
</html>
