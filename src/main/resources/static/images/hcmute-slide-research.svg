<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="overlayGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(2, 5, 32, 0.88)"/>
      <stop offset="50%" stop-color="rgba(2, 5, 32, 0.5)"/>
      <stop offset="100%" stop-color="rgba(2, 5, 32, 0.1)"/>
    </linearGradient>
    <pattern id="circuitPat" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 10 10 L 50 10 L 50 50 M 10 50 L 30 50 L 30 30" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.5"/>
      <circle cx="10" cy="10" r="2.5" fill="rgba(255,255,255,0.12)"/>
      <circle cx="50" cy="50" r="2.5" fill="rgba(255,255,255,0.12)"/>
    </pattern>
  </defs>
  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad2)"/>
  <rect width="1200" height="400" fill="url(#circuitPat)"/>
  
  <!-- Innovation Graphics Right -->
  <g transform="translate(800, 70)">
    <!-- Tech Orbit Glow -->
    <circle cx="200" cy="130" r="140" fill="none" stroke="#60A5FA" stroke-width="2" opacity="0.3"/>
    <circle cx="200" cy="130" r="90" fill="none" stroke="#93C5FD" stroke-width="2" stroke-dasharray="6 6" opacity="0.4"/>
    
    <!-- Code / Data Analytics Window -->
    <rect x="70" y="30" width="260" height="170" rx="14" fill="#0B132B" stroke="#3B82F6" stroke-width="2" opacity="0.95"/>
    <!-- Window Header -->
    <rect x="70" y="30" width="260" height="28" rx="14" fill="#1C2541"/>
    <circle cx="88" cy="44" r="4.5" fill="#EF4444"/>
    <circle cx="102" cy="44" r="4.5" fill="#F59E0B"/>
    <circle cx="116" cy="44" r="4.5" fill="#10B981"/>
    <text x="140" y="48" fill="#94A3B8" font-family="monospace" font-size="11">research_model.py</text>
    
    <!-- Code Lines -->
    <rect x="90" y="74" width="90" height="7" rx="3" fill="#60A5FA"/>
    <rect x="190" y="74" width="60" height="7" rx="3" fill="#F472B6"/>
    <rect x="105" y="94" width="130" height="7" rx="3" fill="#34D399"/>
    <rect x="105" y="114" width="80" height="7" rx="3" fill="#FBBF24"/>
    <rect x="105" y="134" width="150" height="7" rx="3" fill="#A78BFA"/>
    <rect x="90" y="154" width="70" height="7" rx="3" fill="#60A5FA"/>
    <rect x="170" y="154" width="50" height="7" rx="3" fill="#38BDF8"/>

    <!-- Lightbulb / AI Brain Node Badge -->
    <g transform="translate(40, 140)">
      <circle cx="36" cy="36" r="36" fill="#1E40AF" stroke="#60A5FA" stroke-width="3"/>
      <path d="M 28 42 L 44 42 M 31 47 L 41 47 M 26 26 C 26 20 46 20 46 26 C 46 32 40 34 40 38 L 32 38 C 32 34 26 32 26 26 Z" fill="#FDE047" stroke="#CA8A04" stroke-width="1.5"/>
    </g>

    <!-- Floating Metric Cards -->
    <g transform="translate(250, 160)">
      <rect x="0" y="0" width="110" height="60" rx="10" fill="#FFFFFF" opacity="0.95"/>
      <text x="12" y="24" fill="#0F172A" font-family="sans-serif" font-weight="bold" font-size="16">100%</text>
      <text x="12" y="44" fill="#64748B" font-family="sans-serif" font-size="11">Duyệt NCKH</text>
    </g>
  </g>

  <!-- Left Shading Gradient -->
  <rect width="700" height="400" fill="url(#overlayGrad2)"/>
</svg>
