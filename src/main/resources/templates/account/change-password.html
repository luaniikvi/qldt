<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(title='Đổi mật khẩu tài khoản')}"></head>
<body>

<header th:replace="~{fragments/layout :: portal-header}"></header>
<aside th:replace="~{fragments/layout :: portal-sidebar(active='change-password')}"></aside>

<main class="portal-main">
    <div th:replace="~{fragments/layout :: portal-page-header(title='ĐỔI MẬT KHẨU TÀI KHOẢN', icon='bi-shield-lock-fill', actionUrl=null, actionText=null, actionIcon=null)}"></div>

    <div th:replace="~{fragments/layout :: flash-messages}"></div>

    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="hcmute-card p-4">
                <div class="d-flex align-items-center gap-3 mb-4 pb-3 border-bottom">
                    <div class="sidebar-avatar" style="width: 50px; height: 50px; font-size: 18px;"
                         th:text="${currentUserInitials != null ? currentUserInitials : (#authentication.name == 'admin' ? 'AD' : 'U')}">AD</div>
                    <div>
                        <div class="fw-bold fs-6" th:text="${currentUserAccount != null ? currentUserAccount.fullName : (#authentication.name == 'admin' ? 'Quản trị hệ thống' : #authentication.name)}">Họ và Tên</div>
                        <div class="text-muted small" th:text="${'Tài khoản: ' + ((currentUserCode != null and !currentUserCode.isEmpty()) ? currentUserCode : #authentication.name)}">Mã</div>
                    </div>
                </div>

                <form th:action="@{/account/change-password}" th:object="${passwordForm}" method="post">
                    <div class="hcmute-alert hcmute-alert-danger" th:if="${#fields.hasGlobalErrors()}">
                        <i class="bi bi-exclamation-triangle-fill fs-5"></i>
                        <div>
                            <div th:each="err : ${#fields.globalErrors()}" th:text="${err}">Lỗi</div>
                        </div>
                    </div>

                    <div class="form-group mb-3">
                        <label class="form-label required" for="currentPassword">Mật khẩu hiện tại</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-key"></i></span>
                            <input type="password" id="currentPassword" th:field="*{currentPassword}"
                                   class="form-control" th:classappend="${#fields.hasErrors('currentPassword')} ? 'is-invalid' : ''"
                                   placeholder="Nhập mật khẩu hiện tại" required />
                            <button type="button" class="btn btn-outline-secondary btn-toggle-password" data-target="#currentPassword">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                        <div class="invalid-feedback" th:errors="*{currentPassword}"></div>
                    </div>

                    <div class="form-group mb-3">
                        <label class="form-label required" for="newPassword">Mật khẩu mới</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                            <input type="password" id="newPassword" th:field="*{newPassword}"
                                   class="form-control" th:classappend="${#fields.hasErrors('newPassword')} ? 'is-invalid' : ''"
                                   placeholder="Nhập mật khẩu mới (tối thiểu 6 ký tự)" required />
                            <button type="button" class="btn btn-outline-secondary btn-toggle-password" data-target="#newPassword">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                        <div class="invalid-feedback" th:errors="*{newPassword}"></div>
                        <div class="form-hint">Mật khẩu nên chứa cả chữ hoa, chữ thường và chữ số để tăng tính bảo mật.</div>
                    </div>

                    <div class="form-group mb-4">
                        <label class="form-label required" for="confirmPassword">Xác nhận mật khẩu mới</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-lock-fill"></i></span>
                            <input type="password" id="confirmPassword" th:field="*{confirmPassword}"
                                   class="form-control" th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid' : ''"
                                   placeholder="Nhập lại chính xác mật khẩu mới" required />
                            <button type="button" class="btn btn-outline-secondary btn-toggle-password" data-target="#confirmPassword">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                        <div class="invalid-feedback" th:errors="*{confirmPassword}"></div>
                    </div>

                    <div class="d-flex align-items-center gap-2 pt-2 border-top">
                        <button type="submit" class="btn-hcmute-primary">
                            <i class="bi bi-check-lg"></i> Xác nhận đổi mật khẩu
                        </button>
                        <a th:href="@{/announcements}" class="btn-hcmute-secondary">Hủy bỏ</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</main>

<th:block th:replace="~{fragments/layout :: portal-scripts}"></th:block>
</body>
</html>
