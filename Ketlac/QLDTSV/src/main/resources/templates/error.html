<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Đã có lỗi xảy ra - HCMUTE</title>

    <!-- Favicon Khoa CNTT -->
    <link rel="icon" type="image/png" th:href="@{/images/fit-logo.png}">
    <link rel="shortcut icon" type="image/png" th:href="@{/images/fit-logo.png}">

    <!-- Google Fonts: Be Vietnam Pro -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

    <!-- Bootstrap 5.3 & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- CSS System -->
    <link rel="stylesheet" th:href="@{/css/design-tokens.css}">
    <style>
        body {
            background-color: var(--color-background);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--space-4);
        }
        .error-card {
            background-color: #FFFFFF;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            padding: 48px 36px;
            max-width: 520px;
            width: 100%;
            text-align: center;
            border-top: 4px solid var(--color-danger);
        }
        .error-code {
            font-size: 64px;
            font-weight: 800;
            color: var(--color-danger);
            line-height: 1;
            margin-bottom: var(--space-2);
        }
    </style>
</head>
<body>

<div class="error-card">
    <div class="mb-3">
        <img th:src="@{/images/hcmute-logo.svg}" alt="Logo HCMUTE" height="50">
    </div>

    <div class="error-code" th:text="${status != null ? status : 'Lỗi'}">500</div>
    <h1 class="h2 mb-3" th:text="${error != null ? error : 'Đã có sự cố xảy ra'}">Đã xảy ra sự cố kỹ thuật</h1>

    <p class="text-muted mb-4" th:text="${message != null and !message.isBlank() ? message : 'Hệ thống không thể xử lý yêu cầu này lúc này. Vui lòng thử lại sau hoặc liên hệ quản trị viên khoa.'}">
        Hệ thống không thể xử lý yêu cầu của bạn.
    </p>

    <div class="d-flex justify-content-center gap-2">
        <a th:href="@{/home}" class="btn-hcmute-primary">
            <i class="bi bi-house-door-fill"></i> Về trang chủ
        </a>
        <a th:href="@{/announcements}" class="btn-hcmute-secondary">
            <i class="bi bi-speedometer2"></i> Cổng thông tin
        </a>
    </div>
</div>

</body>
</html>
